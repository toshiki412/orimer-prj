; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; [env:pico32]
; platform = espressif32
; board = pico32
; framework = arduino
; lib_deps = 
; 	m5stack/M5Atom@^0.1.3
; 	fastled/FastLED@^3.9.20

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
lib_deps = 
	m5stack/M5Atom@^0.1.3
	fastled/FastLED@^3.9.20
  h2zero/NimBLE-Arduino
; COMポート明示指
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200

; increase app partition (sacrifice OTA/spiffs) — try huge_app
board_build.partitions = huge_app.csv
; ensure toolchain knows flash size (optional)
board_build.flash_size = 4MB
; reduce debug/log size
build_flags = 
  -DCORE_DEBUG_LEVEL=0
  -Wl,--gc-sections
  -fdata-sections
  -ffunction-sections
; strip symbols to reduce size at link
; (PlatformIO/ESP32 usually strips, but keep this if needed)
; build_unflags = -g

; ==============================
; AtomS3R (ESP32-S3)
; ==============================
[env:m5stack-atoms3r]
platform = espressif32
board = m5stack-atoms3r
framework = arduino
monitor_speed = 115200

upload_port = COM*
monitor_port = COM*

lib_deps =
	m5stack/M5Unified
	h2zero/NimBLE-Arduino

board_build.flash_size = 8MB
build_flags =
  -DCORE_DEBUG_LEVEL=0